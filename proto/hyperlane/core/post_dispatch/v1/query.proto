syntax = "proto3";
package hyperlane.core.post_dispatch.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "hyperlane/core/post_dispatch/v1/types.proto";

option go_package = "github.com/bcp-innovations/hyperlane-cosmos/x/core/02_post_dispatch/types";

// Msg defines the module Msg service.
service Query {
  // Igps ...
  rpc Igps(QueryIgpsRequest) returns (QueryIgpsResponse) {
    option (google.api.http).get = "/hyperlane/v1/igps";
  }

  // Igp ...
  rpc Igp(QueryIgpRequest) returns (QueryIgpResponse) {
    option (google.api.http).get = "/hyperlane/v1/igps/{id}";
  }

  // DestinationGasConfigs ...
  rpc DestinationGasConfigs(QueryDestinationGasConfigsRequest)
      returns (QueryDestinationGasConfigsResponse) {
    option (google.api.http).get =
        "/hyperlane/v1/igps/{id}/destination_gas_configs";
  }

  // QuoteGasPayment ...
  rpc QuoteGasPayment(QueryQuoteGasPaymentRequest)
      returns (QueryQuoteGasPaymentResponse) {
    option (google.api.http).get =
        "/hyperlane/v1/igps/{igp_id}/quote_gas_payment";
  }

  // MerkleTreeHooks ...
  rpc MerkleTreeHooks(QueryMerkleTreeHooksRequest)
      returns (QueryMerkleTreeHooksResponse) {
    option (google.api.http).get = "/hyperlane/v1/merkle_tree_hooks";
  }

  // MerkleTreeHook ...
  rpc MerkleTreeHook(QueryMerkleTreeHookRequest)
      returns (QueryMerkleTreeHookResponse) {
    option (google.api.http).get = "/hyperlane/v1/merkle_tree_hooks/{id}";
  }

  // NoopHooks ...
  rpc NoopHooks(QueryNoopHooksRequest) returns (QueryNoopHooksResponse) {
    option (google.api.http).get = "/hyperlane/v1/noop_hooks";
  }

  // NoopHook ...
  rpc NoopHook(QueryNoopHookRequest) returns (QueryNoopHookResponse) {
    option (google.api.http).get = "/hyperlane/v1/noop_hooks/{id}";
  }

  // AggregationHooks ...
  rpc AggregationHooks(QueryAggregationHooksRequest)
      returns (QueryAggregationHooksResponse) {
    option (google.api.http).get = "/hyperlane/v1/aggregation_hooks";
  }

  // AggregationHook ...
  rpc AggregationHook(QueryAggregationHookRequest)
      returns (QueryAggregationHookResponse) {
    option (google.api.http).get = "/hyperlane/v1/aggregation_hooks/{id}";
  }

  // RateLimitedHooks ...
  rpc RateLimitedHooks(QueryRateLimitedHooksRequest)
      returns (QueryRateLimitedHooksResponse) {
    option (google.api.http).get = "/hyperlane/v1/rate_limited_hooks";
  }

  // RateLimitedHook ...
  rpc RateLimitedHook(QueryRateLimitedHookRequest)
      returns (QueryRateLimitedHookResponse) {
    option (google.api.http).get = "/hyperlane/v1/rate_limited_hooks/{id}";
  }

  // TokenRateLimits ...
  rpc TokenRateLimits(QueryTokenRateLimitsRequest)
      returns (QueryTokenRateLimitsResponse) {
    option (google.api.http).get =
        "/hyperlane/v1/rate_limited_hooks/{hook_id}/token_rate_limits";
  }

  // TokenRateLimit ...
  rpc TokenRateLimit(QueryTokenRateLimitRequest)
      returns (QueryTokenRateLimitResponse) {
    option (google.api.http).get = "/hyperlane/v1/rate_limited_hooks/{hook_id}/"
                                   "token_rate_limits/{token_id}";
  }
}

// QueryIgpsRequest ...
message QueryIgpsRequest {
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryIgpsResponse ...
message QueryIgpsResponse {
  repeated InterchainGasPaymaster igps = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryIgpRequest ...
message QueryIgpRequest { string id = 1; }

// QueryIgpResponse ...
message QueryIgpResponse {
  InterchainGasPaymaster igp = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// QueryDestinationGasConfigsRequest ...
message QueryDestinationGasConfigsRequest {
  string id = 1;
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryDestinationGasConfigsResponse ...
message QueryDestinationGasConfigsResponse {
  repeated DestinationGasConfig destination_gas_configs = 1;
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryQuoteGasPaymentRequest ...
message QueryQuoteGasPaymentRequest {
  string igp_id = 1;
  string destination_domain = 2;
  string gas_limit = 3;
}

// QueryQuoteGasPaymentResponse ...
message QueryQuoteGasPaymentResponse {
  repeated cosmos.base.v1beta1.Coin gas_payment = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}

// QueryMerkleTreeHooksRequest ...
message QueryMerkleTreeHooksRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryMerkleTreeHooksResponse ...
message QueryMerkleTreeHooksResponse {
  repeated WrappedMerkleTreeHookResponse merkle_tree_hooks = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryMerkleTreeHookRequest ...
message QueryMerkleTreeHookRequest { string id = 1; }

// QueryMerkleTreeHookResponse
message QueryMerkleTreeHookResponse {
  WrappedMerkleTreeHookResponse merkle_tree_hook = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// WrappedMerkleTreeHookResponse
message WrappedMerkleTreeHookResponse {
  string id = 1;
  string owner = 2;
  string mailbox_id = 3;

  TreeResponse merkle_tree = 4;
}

// TreeResponse
message TreeResponse {
  // leafs ...
  repeated bytes leafs = 1;

  // count ...
  uint32 count = 2;

  // root ...
  bytes root = 3;
}

// QueryNoopHookRequest ...
message QueryNoopHookRequest { string id = 1; }

// QueryNoopHookResponse ...
message QueryNoopHookResponse { NoopHook noop_hook = 1; }

// QueryNoopHooksRequest ...
message QueryNoopHooksRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryNoopHooksResponse ...
message QueryNoopHooksResponse {
  repeated NoopHook noop_hooks = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryAggregationHookRequest ...
message QueryAggregationHookRequest { string id = 1; }

// QueryAggregationHookResponse ...
message QueryAggregationHookResponse { AggregationHook aggregation_hook = 1; }

// QueryAggregationHooksRequest ...
message QueryAggregationHooksRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAggregationHooksResponse ...
message QueryAggregationHooksResponse {
  repeated AggregationHook aggregation_hooks = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryRateLimitedHookRequest ...
message QueryRateLimitedHookRequest { string id = 1; }

// QueryRateLimitedHookResponse ...
message QueryRateLimitedHookResponse { RateLimitedHook rate_limited_hook = 1; }

// QueryRateLimitedHooksRequest ...
message QueryRateLimitedHooksRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryRateLimitedHooksResponse ...
message QueryRateLimitedHooksResponse {
  repeated RateLimitedHook rate_limited_hooks = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryTokenRateLimitsRequest ...
message QueryTokenRateLimitsRequest {
  string hook_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryTokenRateLimitsResponse ...
message QueryTokenRateLimitsResponse {
  repeated EffectiveTokenRateLimit effective_token_rate_limits = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryTokenRateLimitRequest ...
message QueryTokenRateLimitRequest {
  string hook_id = 1;
  string token_id = 2;
}

// QueryTokenRateLimitResponse ...
message QueryTokenRateLimitResponse {
  EffectiveTokenRateLimit effective_token_rate_limit = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// EffectiveTokenRateLimit ...
message EffectiveTokenRateLimit {
  TokenRateLimit token_rate_limit = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  string current_level = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string effective_capacity = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}
