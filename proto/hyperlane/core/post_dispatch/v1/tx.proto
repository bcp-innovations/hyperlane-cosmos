syntax = "proto3";
package hyperlane.core.post_dispatch.v1;

option go_package = "github.com/bcp-innovations/hyperlane-cosmos/x/core/02_post_dispatch/types";

import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "hyperlane/core/post_dispatch/v1/types.proto";
import "cosmos/base/v1beta1/coin.proto";

// Msg defines the module Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // CreateIgp ...
  rpc CreateIgp(MsgCreateIgp) returns (MsgCreateIgpResponse);

  // SetIgpOwner ...
  rpc SetIgpOwner(MsgSetIgpOwner) returns (MsgSetIgpOwnerResponse);

  // SetDestinationGasConfig ...
  rpc SetDestinationGasConfig(MsgSetDestinationGasConfig)
      returns (MsgSetDestinationGasConfigResponse);

  // PayForGas ...
  rpc PayForGas(MsgPayForGas) returns (MsgPayForGasResponse);

  // Claim ...
  rpc Claim(MsgClaim) returns (MsgClaimResponse);

  // CreateMerkleTreeHook ...
  rpc CreateMerkleTreeHook(MsgCreateMerkleTreeHook)
      returns (MsgCreateMerkleTreeHookResponse);

  // CreateNoopHook ...
  rpc CreateNoopHook(MsgCreateNoopHook) returns (MsgCreateNoopHookResponse);

  // CreateAggregationHook ...
  rpc CreateAggregationHook(MsgCreateAggregationHook)
      returns (MsgCreateAggregationHookResponse);

  // CreatePausableHook ...
  rpc CreatePausableHook(MsgCreatePausableHook)
      returns (MsgCreatePausableHookResponse);

  // SetPausableHookPaused ...
  rpc SetPausableHookPaused(MsgSetPausableHookPaused)
      returns (MsgSetPausableHookPausedResponse);

  // CreateRateLimitedHook ...
  rpc CreateRateLimitedHook(MsgCreateRateLimitedHook)
      returns (MsgCreateRateLimitedHookResponse);

  // SetRateLimit ...
  rpc SetRateLimit(MsgSetRateLimit) returns (MsgSetRateLimitResponse);

  // RemoveRateLimit ...
  rpc RemoveRateLimit(MsgRemoveRateLimit) returns (MsgRemoveRateLimitResponse);
}

// MsgCreateIgp ...
message MsgCreateIgp {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hyperlane/v1/MsgCreateIgp";

  // owner is the message sender.
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // denom
  string denom = 2;
}

// MsgCreateIgpResponse ...
message MsgCreateIgpResponse {
  string id = 1 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgSetIgpOwner ...
message MsgSetIgpOwner {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hyperlane/v1/MsgSetIgpOwner";

  // owner is the message sender.
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // igp_id
  string igp_id = 2 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];

  // new_owner
  string new_owner = 3;

  // renounce_ownership
  bool renounce_ownership = 4;
}

// MsgSetIgpOwnerResponse ...
message MsgSetIgpOwnerResponse {}

// MsgSetDestinationGasConfig ...
message MsgSetDestinationGasConfig {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hyperlane/v1/MsgSetDestinationGasConfig";

  // owner ...
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // igp_id ...
  string igp_id = 2 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];

  // destination_gas_config ...
  DestinationGasConfig destination_gas_config = 3;
}

// MsgSetDestinationGasConfigResponse ...
message MsgSetDestinationGasConfigResponse {}

// MsgPayForGas ...
message MsgPayForGas {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "hyperlane/v1/MsgPayForGas";

  // sender ...
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // igp_id ...
  string igp_id = 2 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];

  // message_id ...
  string message_id = 3 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];

  // destination_domain ...
  uint32 destination_domain = 4;

  // gas_limit ...
  string gas_limit = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // amount ...
  cosmos.base.v1beta1.Coin amount = 6
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgPayForGasResponse ...
message MsgPayForGasResponse {}

// MsgClaim ...
message MsgClaim {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "hyperlane/v1/MsgClaim";

  // sender ...
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // igp_id ...
  string igp_id = 2 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgClaimResponse ...
message MsgClaimResponse {}

// MsgCreateMerkleTreeHook ...
message MsgCreateMerkleTreeHook {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hyperlane/v1/MsgCreateMerkleTreeHook";

  // sender ...
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  string mailbox_id = 2 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgCreateMerkleTreeHookResponse ...
message MsgCreateMerkleTreeHookResponse {
  string id = 1 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgCreateNoopHook ...
message MsgCreateNoopHook {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hyperlane/v1/MsgCreateNoopHook";

  // sender ...
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

// MsgCreateNoopHookResponse ...
message MsgCreateNoopHookResponse {
  string id = 1 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgCreateAggregationHook ...
message MsgCreateAggregationHook {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hyperlane/v1/MsgCreateAggregationHook";

  // owner ...
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // hooks ...
  repeated string hooks = 2 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgCreateAggregationHookResponse ...
message MsgCreateAggregationHookResponse {
  string id = 1 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgCreatePausableHook ...
message MsgCreatePausableHook {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hyperlane/v1/MsgCreatePausableHook";

  // owner ...
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // mailbox_id ...
  string mailbox_id = 2 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgCreatePausableHookResponse ...
message MsgCreatePausableHookResponse {
  string id = 1 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgSetPausableHookPaused ...
message MsgSetPausableHookPaused {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hyperlane/v1/MsgSetPausableHookPaused";

  // owner ...
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // hook_id ...
  string hook_id = 2 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];

  // paused ...
  bool paused = 3;
}

// MsgSetPausableHookPausedResponse ...
message MsgSetPausableHookPausedResponse {}

// MsgCreateRateLimitedHook ...
message MsgCreateRateLimitedHook {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hyperlane/v1/MsgCreateRateLimitedHook";

  // owner ...
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // mailbox_id ...
  string mailbox_id = 2 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgCreateRateLimitedHookResponse ...
message MsgCreateRateLimitedHookResponse {
  string id = 1 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgSetRateLimit ...
message MsgSetRateLimit {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hyperlane/v1/MsgSetRateLimit";

  // owner ...
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // hook_id ...
  string hook_id = 2 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];

  // token_id ...
  string token_id = 3 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];

  // max_capacity ...
  string max_capacity = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// MsgSetRateLimitResponse ...
message MsgSetRateLimitResponse {}

// MsgRemoveRateLimit ...
message MsgRemoveRateLimit {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "hyperlane/v1/MsgRemoveRateLimit";

  // owner ...
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // hook_id ...
  string hook_id = 2 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];

  // token_id ...
  string token_id = 3 [
    (gogoproto.customtype) =
        "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable) = false
  ];
}

// MsgRemoveRateLimitResponse ...
message MsgRemoveRateLimitResponse {}
